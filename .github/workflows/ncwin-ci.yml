# SPDX-License-Identifier: AGPL-3.0-or-later
# ncwin (native Windows build) CI. Upstream's own workflows are disabled on
# this fork with `gh workflow disable`; only ncwin-* workflows run here.
name: ncwin CI

on:
  push:
    branches: ['master']  # master mirrors win/NN; avoid a duplicate run per push
  pull_request:
    branches: ['master', 'win/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Branch or commit to build (the caller's own commit otherwise).
        type: string
        default: ''
      version:
        description: Release tag stamped into ncwin.exe, e.g. v35.0.3-win.1.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  supervisor:
    runs-on: windows-latest
    steps:
      - name: Check out byte-for-byte (no CRLF conversion)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/supervisor/go.mod
      - name: go vet + test (supervisor)
        working-directory: windows/supervisor
        run: |
          go vet ./...
          go test ./... -count=1
      - name: go vet (integration tests)
        working-directory: windows/tests
        run: go vet ./...

  windows-lint:
    # Every bare dirname()/unguarded posix_*() must be routed or explicitly reviewed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - run: python3 windows/build/lint_windows.py

  php-lint:
    # Every PHP file the fork touches must parse on the PHP version we ship.
    runs-on: windows-latest
    steps:
      - name: Check out byte-for-byte (no CRLF conversion)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Fetch upstream tags
        # Only the base tag: upstream has tags differing only in case, which
        # collide on Windows' case-insensitive file system.
        shell: bash
        run: |
          tag="v$(jq -r .nextcloud.version windows/build/deps.lock.json)"
          git fetch --no-tags https://github.com/nextcloud/server.git "+refs/tags/$tag:refs/tags/$tag"
      - name: Lint patched PHP files
        shell: pwsh
        run: |
          $lock = Get-Content windows/build/deps.lock.json -Raw | ConvertFrom-Json
          Invoke-WebRequest $lock.frankenphp.url -OutFile fp.zip
          if ((Get-FileHash fp.zip -Algorithm SHA256).Hash -ne $lock.frankenphp.sha256.ToUpper()) { throw 'frankenphp hash mismatch' }
          & "$env:SystemRoot\System32\tar.exe" -xf fp.zip -C $env:RUNNER_TEMP
          $php = Join-Path $env:RUNNER_TEMP 'php.exe'
          $files = git diff --name-only --diff-filter=AM "v$($lock.nextcloud.version)" HEAD -- '*.php' 'occ'
          $files += Get-ChildItem windows/app -Recurse -Filter *.php | ForEach-Object { $_.FullName }
          $bad = 0
          foreach ($f in $files) { & $php -n -l $f | Out-Null; if ($LASTEXITCODE -ne 0) { & $php -n -l $f; $bad++ } }
          if ($bad) { throw "$bad file(s) fail php -l" }
          "linted $($files.Count) files"

  phpunit-windows:
    # Upstream's own PHPUnit suites for the code the patch set touches, on
    # Windows with the PHP we ship. Only failures listed in
    # windows/tests/phpunit-known-upstream.txt (which also fail on stock
    # Linux) are tolerated.
    runs-on: windows-latest
    steps:
      - name: Check out byte-for-byte (no CRLF conversion)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: true
      - name: PHP runtime + PHPUnit
        shell: pwsh
        run: |
          $lock = Get-Content windows/build/deps.lock.json -Raw | ConvertFrom-Json
          $php = Join-Path $env:RUNNER_TEMP 'php'
          foreach ($d in @(@{u = $lock.frankenphp.url; s = $lock.frankenphp.sha256; to = $php}, @{u = $lock.pecl.apcu.url; s = $lock.pecl.apcu.sha256; to = "$php-apcu"})) {
            Invoke-WebRequest $d.u -OutFile dl.zip
            if ((Get-FileHash dl.zip -Algorithm SHA256).Hash -ne $d.s.ToUpper()) { throw "hash mismatch: $($d.u)" }
            New-Item -ItemType Directory -Force $d.to | Out-Null
            & "$env:SystemRoot\System32\tar.exe" -xf dl.zip -C $d.to
          }
          Copy-Item "$php-apcu\php_apcu.dll" "$php\ext\"
          $ext = "$php\ext" -replace '\\', '/'
          @('[PHP]', "extension_dir = `"$ext`"", 'memory_limit = 4G',
            'extension = curl', 'extension = fileinfo', 'extension = gd', 'extension = gmp', 'extension = intl',
            'extension = mbstring', 'extension = exif', 'extension = openssl', 'extension = sodium', 'extension = zip',
            'extension = pdo_sqlite', 'extension = apcu', 'apc.enable_cli = 1', 'opcache.enable_cli = 0') |
            Set-Content -Encoding ASCII "$php\php.ini"
          "PHPRC=$php" | Out-File -Append $env:GITHUB_ENV
          "OPENSSL_CONF=$php\extras\ssl\openssl.cnf" | Out-File -Append $env:GITHUB_ENV
          "$php" | Out-File -Append $env:GITHUB_PATH
          Invoke-WebRequest https://getcomposer.org/download/2.8.12/composer.phar -OutFile composer.phar
          & "$php\php.exe" composer.phar install -d vendor-bin/phpunit --no-interaction --no-progress
      - name: Fresh test instance
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'ncdata'
          php occ maintenance:install --database=sqlite --admin-user=admin --admin-pass=admin "--data-dir=$($data -replace '\\','/')"
          php tests/enable_all.php
      - name: Upstream suites
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/junit"
          sh windows/tests/phpunit-windows.sh php "$RUNNER_TEMP/junit" || true
          python windows/tests/junit_check.py "$RUNNER_TEMP/junit"

  assemble:
    runs-on: windows-latest
    needs: [supervisor, php-lint, windows-lint, phpunit-windows]
    env:
      # `secrets` is not available in step conditions; expose presence via env.
      HAS_SIGNING_KEYS: ${{ secrets.NCWIN_SIGNING_KEYS != '' }}
    steps:
      - name: Check out byte-for-byte (no CRLF conversion)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/supervisor/go.mod
      - name: Fetch upstream tags
        # Only the base tag: upstream has tags differing only in case, which
        # collide on Windows' case-insensitive file system.
        shell: bash
        run: |
          tag="v$(jq -r .nextcloud.version windows/build/deps.lock.json)"
          git fetch --no-tags https://github.com/nextcloud/server.git "+refs/tags/$tag:refs/tags/$tag"
      - name: Restore signing keys
        if: env.HAS_SIGNING_KEYS == 'true'
        shell: pwsh
        env:
          NCWIN_SIGNING_KEYS: ${{ secrets.NCWIN_SIGNING_KEYS }}
        run: |
          # Base64 of a zip holding core.key/.crt and windows_integration.key/.crt.
          $dir = Join-Path $env:RUNNER_TEMP 'signing'
          New-Item -ItemType Directory -Force $dir | Out-Null
          [IO.File]::WriteAllBytes("$dir.zip", [Convert]::FromBase64String($env:NCWIN_SIGNING_KEYS))
          & "$env:SystemRoot\System32\tar.exe" -xf "$dir.zip" -C $dir
          Remove-Item "$dir.zip"
          "NCWIN_SIGNING_DIR=$dir" | Out-File -Append $env:GITHUB_ENV
      - name: Assemble
        shell: pwsh
        run: |
          $a = @{ WorkDir = (Join-Path $env:RUNNER_TEMP 'build'); WithMariaDB = $true; WithPostgres = $true }
          if ($env:NCWIN_SIGNING_DIR) { $a.SigningDir = $env:NCWIN_SIGNING_DIR } else { $a.NoSign = $true }
          if ('${{ inputs.version }}') { $a.Version = '${{ inputs.version }}' }
          ./windows/build/assemble.ps1 @a
      - name: Smoke test (SQLite, foreground)
        shell: pwsh
        run: |
          $b = Join-Path $env:RUNNER_TEMP 'build'
          $exe = Join-Path $b 'out\ncwin\ncwin.exe'
          @"
          [paths]
          install_dir = '$b\out\ncwin'
          state_dir   = '$b\state'
          data_dir    = '$b\data'
          [web]
          http_port  = 18080
          https_port = 18443
          [[web.site]]
          addresses = ["https://localhost:18443"]
          tls = "internal"
          [database]
          type = "sqlite"
          "@ | Set-Content -Encoding UTF8 "$b\ncwin.toml"
          $env:NCWIN_ADMIN_PASS = 'Ci-Admin-Pass-1'
          & $exe setup --config "$b\ncwin.toml" --no-acl
          if ($LASTEXITCODE) { throw 'setup failed' }
          $p = Start-Process $exe -ArgumentList @('run', '--config', "$b\ncwin.toml") -PassThru -NoNewWindow
          $deadline = (Get-Date).AddMinutes(10)
          while (-not ((& $exe events --kind proc.ready) -match ' web ')) {
            if ((Get-Date) -gt $deadline) { throw 'web never became ready' }
            Start-Sleep 2
          }
          Push-Location windows/tests
          $env:NCWIN_URL = 'https://localhost:18443'; $env:NCWIN_USER = 'admin'; $env:NCWIN_PASS = 'Ci-Admin-Pass-1'; $env:NCWIN_DATA = "$b\data"
          go test ./... -count=1 -v -timeout 40m
          $code = $LASTEXITCODE
          Pop-Location
          & $exe occ integrity:check-core
          & $exe occ windows:selftest
          & $exe shutdown
          $p.WaitForExit(900000) | Out-Null
          if ($code) { throw 'integration tests failed' }
      - name: Build MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2 WixToolset.Firewall.wixext/5.0.2
          $b = Join-Path $env:RUNNER_TEMP 'build'
          Remove-Item -Recurse -Force "$b\state", "$b\data" -ErrorAction SilentlyContinue
          ./windows/build/build-msi.ps1 -Payload "$b\out\ncwin" -WinBuild 1 -Out "$b\msi\ncwin.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: ncwin
          path: ${{ runner.temp }}/build/out/ncwin
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ncwin-msi
          path: ${{ runner.temp }}/build/msi
          retention-days: 7
