# SPDX-License-Identifier: AGPL-3.0-or-later
# Daily: watch upstream releases of the major this fork currently tracks
# (windows/build/deps.lock.json). A new vNN.x.y tag opens an issue asking for
# a manual release (windows/build/release.ps1). With the repo variable
# NCWIN_AUTO_RELEASE = "true" it instead rebases win/NN onto the tag, pins
# the new release zip, runs ncwin CI, and publishes vNN.x.y-win.1; a
# conflicting rebase then opens an issue. A new major always opens an issue:
# moving majors (app max-version, deps) is a reviewed step (UPSTREAM.md).
name: ncwin upstream tracking

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  track:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.detect.outputs.new_tag }}
      branch: ${{ steps.detect.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Keep upstream's own workflows disabled
        # They register lazily from the default branch; only ncwin-* should run on this fork.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq '.workflows[] | select(.state == "active") | select(.path | test("ncwin-") | not) | .id' |
            while read -r id; do gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$id/disable"; echo "disabled $id"; done
      - name: Detect new upstream release
        id: detect
        run: |
          git fetch --no-tags https://github.com/nextcloud/server.git "+refs/tags/v*:refs/tags/v*"
          cur=$(jq -r .nextcloud.version windows/build/deps.lock.json)
          major=${cur%%.*}
          echo "branch=win/$major" >> "$GITHUB_OUTPUT"
          latest=$(git tag -l "v$major.*" | grep -E "^v$major\.[0-9]+\.[0-9]+$" | sort -V | tail -1)
          if [ -n "$(git tag -l "v$((major+1)).0.0")" ]; then echo "next_major=$((major+1))" >> "$GITHUB_OUTPUT"; fi
          if [ "$latest" = "v$cur" ]; then echo "up to date at v$cur"; exit 0; fi
          echo "new_tag=$latest" >> "$GITHUB_OUTPUT"
          echo "new upstream release: $latest (fork is on v$cur)"
      - name: Open issues for what needs a hand
        # One issue per upstream release (none if one is already open). A new
        # major always needs a hand; a point release does unless the repo
        # variable NCWIN_AUTO_RELEASE is "true" (then the jobs below rebase,
        # build and release it).
        if: steps.detect.outputs.next_major != '' || (steps.detect.outputs.new_tag != '' && vars.NCWIN_AUTO_RELEASE != 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.detect.outputs.next_major }}
          NEW: ${{ steps.detect.outputs.new_tag }}
          AUTO: ${{ vars.NCWIN_AUTO_RELEASE }}
        run: |
          cur="v$(jq -r .nextcloud.version windows/build/deps.lock.json)"
          open_issue() {
            if gh issue list --state open --search "in:title \"$1\"" --json title --jq '.[].title' | grep -qxF "$1"; then
              echo "already open: $1"
            else
              gh issue create --title "$1" --body "$2"
            fi
          }
          if [ -n "$NEXT" ]; then
            open_issue "ncwin: Nextcloud $NEXT released" "Upstream tagged v$NEXT.0.0. Follow windows/UPSTREAM.md \"New major\" to create win/$NEXT, then release it with windows/build/release.ps1."
          fi
          if [ -n "$NEW" ] && [ "$AUTO" != "true" ]; then
            open_issue "ncwin: Nextcloud ${NEW#v} released" "Upstream tagged $NEW (this fork is on $cur). Follow windows/UPSTREAM.md \"Point release\": rebase, mirror and pin the release zip, then \`windows/build/release.ps1 -WinBuild 1 -Publish\`. Installed servers pick the release up with their daily update task."
          fi

      - name: Rebase win branch onto new release
        if: steps.detect.outputs.new_tag != '' && vars.NCWIN_AUTO_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.detect.outputs.new_tag }}
          BRANCH: ${{ steps.detect.outputs.branch }}
          DEPLOY_KEY: ${{ secrets.NCWIN_DEPLOY_KEY }}
        run: |
          git config user.name "ncwin-bot"
          git config user.email "ncwin-bot@users.noreply.github.com"
          # GITHUB_TOKEN can never push changes to .github/workflows, and rebasing
          # onto a new upstream release usually brings upstream workflow changes.
          # Push with the repo's write deploy key instead (secret NCWIN_DEPLOY_KEY).
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::secret NCWIN_DEPLOY_KEY is not set (see windows/UPSTREAM.md)"; exit 1
          fi
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config core.sshCommand "ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes"
          git remote set-url origin "git@github.com:$GITHUB_REPOSITORY.git"
          git switch "$BRANCH"
          old="v$(jq -r .nextcloud.version windows/build/deps.lock.json)"
          if ! git rebase --onto "$NEW" "$old" "$BRANCH"; then
            git rebase --abort
            gh issue create --title "ncwin: rebase onto $NEW conflicts" \
              --body "Automatic \`git rebase --onto $NEW $old $BRANCH\` hit conflicts. Resolve locally (windows/UPSTREAM.md) and push."
            exit 1
          fi
          ver=${NEW#v}
          # download.nextcloud.com rate-limits shared runner addresses, so builds
          # use a verified copy on this repo's deps release (windows/UPSTREAM.md).
          up="https://download.nextcloud.com/server/releases/nextcloud-$ver.zip"
          zip="$RUNNER_TEMP/nextcloud-$ver.zip"
          curl -fsSL --retry 8 --retry-delay 30 --retry-all-errors -o "$zip" "$up"
          sha=$(curl -fsSL --retry 8 --retry-delay 30 --retry-all-errors "$up.sha256" | cut -d' ' -f1)
          test ${#sha} -eq 64
          echo "$sha  $zip" | sha256sum -c -
          if ! gh release view deps --json assets -q '.assets[].name' | grep -qx "nextcloud-$ver.zip"; then
            gh release upload deps "$zip"
            gh release download deps -p SHA256SUMS -D "$RUNNER_TEMP" --clobber
            echo "$sha  nextcloud-$ver.zip" >> "$RUNNER_TEMP/SHA256SUMS"
            gh release upload deps "$RUNNER_TEMP/SHA256SUMS" --clobber
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/deps/nextcloud-$ver.zip"
          jq --arg v "$ver" --arg u "$url" --arg s "$sha" --arg up "$up" \
            '.nextcloud = {version: $v, url: $u, sha256: $s, upstream_url: $up}' \
            windows/build/deps.lock.json > deps.tmp && mv deps.tmp windows/build/deps.lock.json
          git commit -am "win: track Nextcloud $ver"
          git push --force-with-lease origin "$BRANCH"
          # master mirrors the current win/NN (it is the default branch, so the
          # scheduled workflows run from it).
          git push --force origin "$BRANCH:master"

  ci:
    needs: track
    if: needs.track.outputs.new_tag != '' && vars.NCWIN_AUTO_RELEASE == 'true'
    uses: ./.github/workflows/ncwin-ci.yml
    secrets: inherit
    with:
      # The run was triggered on the old commit; build the rebased branch.
      ref: ${{ needs.track.outputs.branch }}
      version: ${{ needs.track.outputs.new_tag }}-win.1

  release:
    needs: [track, ci]
    if: needs.track.outputs.new_tag != '' && vars.NCWIN_AUTO_RELEASE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ncwin
          path: ncwin
      - uses: actions/download-artifact@v4
        with:
          name: ncwin-msi
          path: msi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ needs.track.outputs.new_tag }}
          BRANCH: ${{ needs.track.outputs.branch }}
        run: |
          tag="$NEW-win.1"
          (cd ncwin && zip -qr "../ncwin-${tag#v}.zip" .)
          sha256sum "ncwin-${tag#v}.zip" > "ncwin-${tag#v}.zip.sha256"
          mv msi/ncwin.msi "ncwin-${tag#v}.msi"
          sha256sum "ncwin-${tag#v}.msi" > "ncwin-${tag#v}.msi.sha256"
          gh release create "$tag" "ncwin-${tag#v}.zip" "ncwin-${tag#v}.zip.sha256" "ncwin-${tag#v}.msi" "ncwin-${tag#v}.msi.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$BRANCH" \
            --title "ncwin ${tag#v}" --notes "Nextcloud ${NEW#v} for Windows (automatic build from $BRANCH)."
